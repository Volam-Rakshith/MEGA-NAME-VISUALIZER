        /* TOP BAR */
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(5,5,8,0.97);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 12px 20px;
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        }

        .top-bar .logo {

            background: linear-gradient(135deg, #ff00ff, #00ffff, #ffff00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-right: 10px; white-space: nowrap;
        }

        .top-bar input[type="text"] {
            padding: 10px 18px; font-size: 16px;
            border: 2px solid #222; border-radius: 50px;
            background: #0a0a0f; color: #fff; outline: none;
            transition: 0.3s; min-width: 200px;
        }

        .top-bar input:focus { border-color: #00f0ff; box-shadow: 0 0 20px rgba(0,240,255,0.2); }

        .top-bar .search-box {
            border-color: #1a1a2a;
            min-width: 180px;
        }

        .top-bar .search-box:focus { border-color: #ff00ff; box-shadow: 0 0 20px rgba(255,0,255,0.2); }

        .stats {
            margin-left: auto; color: #555; font-size: 12px;
            font-family: 'Orbitron'; white-space: nowrap;
        }

        .stats b { color: #00f0ff; }

            margin-top: 60px; padding: 10px 20px;
            position: sticky; top: 58px; z-index: 999;
            background: rgba(5,5,8,0.97);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
        }

        .filter-bar button {
            padding: 5px 14px; border-radius: 20px;
            border: 1px solid #1a1a2a; background: transparent;
            color: #666; cursor: pointer; font-size: 11px;
            transition: 0.3s; white-space: nowrap;
        }

        .filter-bar button:hover { border-color: #444; color: #aaa; }
        .filter-bar button.active { background: #fff; color: #000; border-color: #fff; }

        .filter-bar .separator {
            width: 1px; height: 20px; background: #222; margin: 0 5px;
        }

        /* GRID */
        .grid {
            margin-top: 10px; padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
        }

        .card {
            border-radius: 16px; overflow: hidden;
            cursor: pointer; transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.04);
            background: #0a0a0f;
        }

        .card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .card-canvas-wrap {
            height: 200px; position: relative; overflow: hidden;
        }

        .card-canvas-wrap canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        .card-name {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center;
            z-index: 2; text-align: center; padding: 10px;
            word-break: break-word;
        }

        .card-info {
            padding: 10px 14px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px;
        }

        .card-info .cname { font-weight: 600; color: #ccc; }
        .card-info .ctag {
            font-size: 10px; padding: 2px 10px; border-radius: 20px;
            background: rgba(255,255,255,0.06); color: #666;
        }

        /* FULLSCREEN */
        .fs-overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5000; background: #000;
        }

        .fs-overlay.active { display: flex; flex-direction: column; }

        .fs-overlay canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        .fs-overlay .fs-name-wrap {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 2;
            text-align: center; pointer-events: none;
        }

        .fs-toolbar {
            position: absolute; bottom: 0; left: 0; right: 0;
            z-index: 10; padding: 15px 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }

            padding: 8px 20px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: #fff; cursor: pointer; font-size: 13px;
            transition: 0.3s; display: flex; align-items: center; gap: 6px;
        }

        .fs-toolbar button:hover { background: rgba(255,255,255,0.2); }

        .fs-toolbar .spacer { flex: 1; }

        .fs-toolbar .theme-name-label {
            color: #888; font-size: 13px;
            font-family: 'Orbitron'; letter-spacing: 1px;
        }

        .fs-close {
            position: absolute; top: 15px; right: 20px; z-index: 10;
            width: 44px; height: 44px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.5); color: #fff;
            font-size: 22px; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }

        .fs-close:hover { background: rgba(255,0,0,0.4); }

        .fs-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            z-index: 10; width: 50px; height: 80px;
            background: rgba(0,0,0,0.3); border: none; color: #fff;
            font-size: 28px; cursor: pointer; transition: 0.3s;
        }

        .fs-nav:hover { background: rgba(255,255,255,0.15); }
        .fs-nav.prev { left: 0; border-radius: 0 10px 10px 0; }
        .fs-nav.next { right: 0; border-radius: 10px 0 0 10px; }

        /* RECORDING INDICATOR */
        .rec-indicator {
            position: absolute; top: 15px; left: 20px; z-index: 10;
            display: none; align-items: center; gap: 8px;
            padding: 8px 16px; border-radius: 30px;
            background: rgba(255,0,0,0.3); color: #ff4444;
            font-family: 'Orbitron'; font-size: 12px;
            animation: recPulse 1s infinite;
        }

        .rec-indicator.active { display: flex; }

        .rec-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #ff0000;
        }

        @keyframes recPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }

            align-items: center; justify-content: center;

            background: #222; overflow: hidden; margin-top: 20px;

        .progress-bar-fill {
            height: 100%; width: 0; border-radius: 3px;
            background: linear-gradient(90deg, #00f0ff, #ff00ff);
            transition: width 0.3s;
        }

        .progress-text {
            font-family: 'Orbitron'; font-size: 14px;
            color: #888; margin-top: 15px;
        }

        .progress-title {
            font-family: 'Orbitron'; font-size: 18px;
            color: #fff;
        }

            height: 100px;
            display: flex; align-items: center; justify-content: center;
            color: #333; font-family: 'Orbitron'; font-size: 12px;
        }

        .load-more-trigger .spinner {
            width: 24px; height: 24px; border: 2px solid #222;
            border-top-color: #00f0ff; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-right: 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* TOAST */
        .toast {
            position: fixed; bottom: 80px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            z-index: 99999; padding: 12px 24px;
            border-radius: 30px;
            background: rgba(0,240,255,0.15);
            border: 1px solid rgba(0,240,255,0.3);
            color: #00f0ff;
            font-family: 'Orbitron'; font-size: 12px;
            transition: transform 0.4s, opacity 0.4s;
            opacity: 0; pointer-events: none;
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .top-bar .logo { display: none; }
            .top-bar input[type="text"] { min-width: 120px; }
        }
    </style>
</head>

// ===== GENERATE ALL THEMES =====
function generateAllThemes() {
    const allThemes = [];
    const usedNames = new Set();
    let id = 0;

    // For every category...
    for (const [catName, catData] of Object.entries(CATEGORIES)) {
        const catEffects = catData.effects;
        const paletteKeys = Object.keys(PALETTES);

        // For every effect in this category...
        for (const effect of catEffects) {
            // Pick multiple palettes for variety
            const shuffledPalettes = [...paletteKeys].sort(() => Math.random() - 0.5);
            const numVariants = Math.min(6, shuffledPalettes.length);

            for (let v = 0; v < numVariants; v++) {
                const palette = PALETTES[shuffledPalettes[v]];
                // Pick a font
                const font = FONTS[(id * 7 + v * 13) % FONTS.length];

                // Generate unique name
                let name;
                let attempts = 0;
                do {
                    const adj = ADJ[(id * 3 + v * 7 + attempts * 11) % ADJ.length];
                    const noun = NOUNS[(id * 5 + v * 3 + attempts * 17) % NOUNS.length];
                    name = `${adj} ${noun}`;
                    attempts++;
                } while (usedNames.has(name) && attempts < 50);

                if (!usedNames.has(name)) {
                    usedNames.add(name);
                    allThemes.push({
                        id: id++,
                        name,
                        cat: catName,
                        bg: palette.bg,
                        color: palette.color,
                        glow: palette.glow,
                        font,
                        effect,
                        pc: palette.pc
                    });
                }
            }
        }
    }

    // BONUS: Generate even more by mixing everything randomly
    const bonusCount = 1500;
    const paletteKeys = Object.keys(PALETTES);
    const catKeys = Object.keys(CATEGORIES);

    for (let i = 0; i < bonusCount; i++) {
        const cat = catKeys[i % catKeys.length];
        const catEffects = CATEGORIES[cat].effects;
        const effect = catEffects[i % catEffects.length];
        const pKey = paletteKeys[(i * 7) % paletteKeys.length];
        const palette = PALETTES[pKey];
        const font = FONTS[(i * 3) % FONTS.length];

        let name;
        let attempts = 0;
        do {
            const adj = ADJ[(i * 11 + attempts * 23) % ADJ.length];
            const noun = NOUNS[(i * 13 + attempts * 29) % NOUNS.length];
            name = `${adj} ${noun}`;
            attempts++;
        } while (usedNames.has(name) && attempts < 100);

        if (usedNames.has(name)) {
            name += ` ${id}`;
        }
        usedNames.add(name);

        allThemes.push({
            id: id++,
            name,
            cat,
            bg: palette.bg,
            color: palette.color,
            glow: palette.glow,
            font,
            effect,
            pc: palette.pc
        });
    }

    return allThemes;
}

// ===== GLOBALS =====
const ALL_THEMES = generateAllThemes();
let filteredThemes = [...ALL_THEMES];
let displayedThemes = [];
let currentName = 'DEVELOPER';
let currentFSIndex = 0;
let animFrames = {};
let cardsPerPage = 40;
let currentPage = 0;
let loading = false;
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;

console.log(`🎨 Generated ${ALL_THEMES.length} themes!`);

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
    buildFilters();
    applyFilters();
    setupInfiniteScroll();

    document.getElementById('nameInput').addEventListener('input', (e) => {
        currentName = e.target.value || 'NAME';
        reRenderVisible();
    });

    document.getElementById('searchInput').addEventListener('input', () => applyFilters());

    document.addEventListener('keydown', (e) => {
        const fs = document.getElementById('fsOverlay');
        if (fs.classList.contains('active')) {
            if (e.key === 'Escape') closeFS();
            if (e.key === 'ArrowLeft') navFS(-1);
            if (e.key === 'ArrowRight') navFS(1);
        }
    });
});

function buildFilters() {
    const bar = document.getElementById('filterBar');
    const cats = ['All', ...Object.keys(CATEGORIES)];
    cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.textContent = cat;
        if (cat === 'All') btn.classList.add('active');
        btn.onclick = () => {
            bar.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        };
        bar.appendChild(btn);
    });
}

function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const activeCat = document.querySelector('.filter-bar button.active')?.textContent || 'All';

    filteredThemes = ALL_THEMES.filter(t => {
        const matchCat = activeCat === 'All' || t.cat === activeCat;
        const matchSearch = !search || t.name.toLowerCase().includes(search) ||
                           t.cat.toLowerCase().includes(search) ||
                           t.effect.toLowerCase().includes(search) ||
                           t.font.toLowerCase().includes(search);
        return matchCat && matchSearch;
    });

    currentPage = 0;
    displayedThemes = [];
    document.getElementById('grid').innerHTML = '';

    // Cancel all animations
    Object.keys(animFrames).forEach(k => {
        if (k.startsWith('card-')) {
            cancelAnimationFrame(animFrames[k]);
            delete animFrames[k];
        }
    });

    loadMoreCards();
    updateStats();
}

function updateStats() {
    document.getElementById('shownCount').textContent = displayedThemes.length;
    document.getElementById('totalCount').textContent = filteredThemes.length;
}

function loadMoreCards() {
    if (loading) return;
    loading = true;

    const start = currentPage * cardsPerPage;
    const end = Math.min(start + cardsPerPage, filteredThemes.length);
    const newThemes = filteredThemes.slice(start, end);

    if (newThemes.length === 0) {
        document.getElementById('loadTrigger').style.display = 'none';
        loading = false;
        return;
    }

    document.getElementById('loadTrigger').style.display = 'flex';

    const grid = document.getElementById('grid');
    newThemes.forEach((theme, i) => {
        const globalIdx = start + i;
        const card = createCard(theme, globalIdx);
        grid.appendChild(card);
        displayedThemes.push(theme);
    });

    currentPage++;
    updateStats();

    if (end >= filteredThemes.length) {
        document.getElementById('loadTrigger').style.display = 'none';
    }

    loading = false;
}

function setupInfiniteScroll() {
    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) loadMoreCards();
    }, { rootMargin: '500px' });
    observer.observe(document.getElementById('loadTrigger'));
}

function createCard(theme, idx) {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openFS(idx);

    const wrap = document.createElement('div');
    wrap.className = 'card-canvas-wrap';
    if (theme.bg.startsWith('linear')) {
        wrap.style.background = theme.bg;
    } else {
        wrap.style.background = theme.bg;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 380;
    canvas.height = 200;
    wrap.appendChild(canvas);

    const nameDiv = document.createElement('div');
    nameDiv.className = 'card-name';
    nameDiv.style.fontFamily = `"${theme.font}", sans-serif`;
    nameDiv.style.color = theme.color;
    const len = currentName.length;
    nameDiv.style.fontSize = len > 20 ? '18px' : len > 15 ? '22px' : len > 10 ? '28px' : '34px';
    nameDiv.style.fontWeight = '700';
    if (theme.glow && theme.glow !== 'transparent') {
        nameDiv.style.textShadow = `0 0 15px ${theme.glow}, 0 0 30px ${theme.glow}, 0 0 60px ${theme.glow}`;
    }
    nameDiv.textContent = currentName;
    wrap.appendChild(nameDiv);

    const info = document.createElement('div');
    info.className = 'card-info';
    info.innerHTML = `<span class="cname">${theme.name}</span><span class="ctag">${theme.cat}</span>`;

    card.appendChild(wrap);
    card.appendChild(info);

    // Lazy animation with IntersectionObserver
    const animObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            const key = `card-${theme.id}`;
            if (entry.isIntersecting) {
                if (!animFrames[key]) startEffect(canvas, theme, key);
            } else {
                if (animFrames[key]) {
                    cancelAnimationFrame(animFrames[key]);
                    delete animFrames[key];
                }
            }
        });
    }, { rootMargin: '200px' });
    animObserver.observe(card);

    // Store refs for re-render
    card._nameDiv = nameDiv;
    card._theme = theme;

    return card;
}

function reRenderVisible() {
    document.querySelectorAll('.card').forEach(card => {
        if (card._nameDiv) {
            card._nameDiv.textContent = currentName;
            const len = currentName.length;
            card._nameDiv.style.fontSize = len > 20 ? '18px' : len > 15 ? '22px' : len > 10 ? '28px' : '34px';
        }
    });
    // Update fullscreen if open
    if (document.getElementById('fsOverlay').classList.contains('active')) {
        updateFSName();
    }
}

// ===== EFFECT ENGINE (MEGA VERSION) =====
function startEffect(canvas, theme, id) {
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    let particles = [];
    let tick = 0;

    function initP(count) {
        particles = [];
        for (let i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * W, y: Math.random() * H,
                vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
                size: Math.random() * 3 + 1, opacity: Math.random() * 0.8 + 0.2,
                life: Math.random() * 100, angle: Math.random() * Math.PI * 2,
                speed: Math.random() * 2 + 0.5, hue: Math.random() * 360,
                phase: Math.random() * Math.PI * 2,
                char: String.fromCharCode(0x30A0 + Math.floor(Math.random() * 96))
            });
        }
    }

    const pc = theme.pc || '#ffffff44';

    function draw() {
        ctx.clearRect(0, 0, W, H);
        tick++;

        switch(theme.effect) {
            case 'particles':
                if (!particles.length) initP(35);
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > W) p.vx *= -1;
                    if (p.y < 0 || p.y > H) p.vy *= -1;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                    ctx.fillStyle = pc; ctx.globalAlpha = p.opacity; ctx.fill(); ctx.globalAlpha = 1;
                });
                // Connection lines
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i+1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const d = Math.sqrt(dx*dx+dy*dy);
                        if (d < 60) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = pc; ctx.globalAlpha = (1-d/60)*0.3;
                            ctx.lineWidth = 0.5; ctx.stroke(); ctx.globalAlpha = 1;
                        }
                    }
                }
                break;

            case 'fireflies':
                if (!particles.length) initP(18);
                particles.forEach(p => {
                    p.angle += 0.02;
                    p.x += Math.sin(p.angle + p.phase) * 0.8;
                    p.y += Math.cos(p.angle * 0.7 + p.phase) * 0.5;
                    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
                    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
                    const g = (Math.sin(tick * 0.05 + p.life) + 1) / 2;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 2.5 * g, 0, Math.PI*2);
                    ctx.fillStyle = pc; ctx.globalAlpha = g * 0.7; ctx.fill();
                    // Glow
                    const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*8*g);
                    grad.addColorStop(0, pc); grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad; ctx.globalAlpha = g * 0.2; ctx.fill();
                    ctx.globalAlpha = 1;
                });
                break;

            case 'snow':
                if (!particles.length) initP(50);
                particles.forEach(p => {
                    p.y += p.speed * 0.5; p.x += Math.sin(tick * 0.01 + p.life) * 0.3;
                    if (p.y > H) { p.y = -5; p.x = Math.random() * W; }
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                    ctx.fillStyle = pc; ctx.globalAlpha = p.opacity * 0.8; ctx.fill(); ctx.globalAlpha = 1;
                });
                break;

            case 'confetti':
                if (!particles.length) initP(35);
                const cc = ['#ff0000','#00ff00','#0000ff','#ffff00','#ff00ff','#00ffff','#ff8800','#ff0088','#88ff00','#0088ff'];
                particles.forEach(p => {
                    p.y += p.speed; p.x += Math.sin(tick * 0.02 + p.life) * 1; p.angle += 0.06;
                    if (p.y > H) { p.y = -10; p.x = Math.random() * W; }
                    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
                    ctx.fillStyle = cc[Math.floor(p.life) % cc.length];
                    ctx.globalAlpha = 0.8;
                    ctx.fillRect(-3, -5, 6, 10); ctx.restore(); ctx.globalAlpha = 1;
                });
                break;

            case 'bubbles':
                if (!particles.length) initP(22);
                particles.forEach(p => {
                    p.y -= p.speed * 0.3; p.x += Math.sin(tick * 0.02 + p.life) * 0.5;
                    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; p.size = Math.random()*3+1; }
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI*2);
                    ctx.strokeStyle = pc; ctx.globalAlpha = p.opacity * 0.4;
                    ctx.lineWidth = 1; ctx.stroke();
                    // Highlight
                    ctx.beginPath(); ctx.arc(p.x - p.size, p.y - p.size, p.size * 0.8, 0, Math.PI*2);
                    ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.15; ctx.fill();
                    ctx.globalAlpha = 1;
                });
                break;

            case 'sakura':
                if (!particles.length) initP(18);
                particles.forEach(p => {
                    p.y += p.speed * 0.4; p.x += Math.sin(tick * 0.015 + p.life) * 1.2; p.angle += 0.02;
                    if (p.y > H) { p.y = -10; p.x = Math.random() * W; }
                    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
                    ctx.fillStyle = pc; ctx.globalAlpha = p.opacity * 0.6;
                    // Petal shape
                    ctx.beginPath(); ctx.ellipse(0, 0, 3, 7, 0, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(3, 2, 2, 5, 0.5, 0, Math.PI*2); ctx.fill();
                    ctx.restore(); ctx.globalAlpha = 1;
                });
                break;

            case 'embers':
                if (!particles.length) initP(30);
                particles.forEach(p => {
                    p.y -= p.speed * 0.6; p.x += Math.sin(tick * 0.03 + p.life) * 0.8;
                    p.opacity -= 0.003;
                    if (p.y < 0 || p.opacity <= 0) { p.y = H + 5; p.x = Math.random()*W; p.opacity = Math.random()*0.8+0.2; }
                    const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*4);
                    grad.addColorStop(0, pc); grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad; ctx.globalAlpha = p.opacity;
                    ctx.fillRect(p.x-10, p.y-10, 20, 20); ctx.globalAlpha = 1;
                });
                break;

            case 'stars':
                if (!particles.length) initP(70);
                particles.forEach(p => {
                    const tw = (Math.sin(tick * 0.03 + p.life) + 1) / 2;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * tw, 0, Math.PI*2);
                    ctx.fillStyle = pc; ctx.globalAlpha = tw * p.opacity; ctx.fill(); ctx.globalAlpha = 1;
                });
                break;

            case 'galaxy':
                if (!particles.length) initP(90);
                particles.forEach(p => {
                    const cx = W/2, cy = H/2;
                    const dx = p.x - cx, dy = p.y - cy;
                    const dist = Math.sqrt(dx*dx+dy*dy);
                    const angle = Math.atan2(dy, dx) + 0.003 * (80 / (dist + 15));
                    p.x = cx + Math.cos(angle) * dist; p.y = cy + Math.sin(angle) * dist;
                    const b = (Math.sin(tick*0.02+p.life)+1)/2;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.8, 0, Math.PI*2);
                    ctx.fillStyle = pc; ctx.globalAlpha = p.opacity * b * 0.7; ctx.fill(); ctx.globalAlpha = 1;
                });
                break;

            case 'nebula':
                for (let i = 0; i < 4; i++) {
                    const x = W/2 + Math.sin(tick * 0.01 + i * 2) * 80;
                    const y = H/2 + Math.cos(tick * 0.013 + i * 3) * 40;
                    const grad = ctx.createRadialGradient(x, y, 0, x, y, 80 + i * 20);
                    grad.addColorStop(0, pc); grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
                }
                break;

            case 'shootingStars':
                if (!particles.length) initP(55);
                particles.slice(0, 45).forEach(p => {
                    const tw = (Math.sin(tick*0.02+p.life)+1)/2;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*0.5*tw, 0, Math.PI*2);
                    ctx.fillStyle = '#ffffff'; ctx.globalAlpha = tw*0.4; ctx.fill(); ctx.globalAlpha = 1;
                });
                particles.slice(45).forEach(p => {
                    p.x += 3; p.y += 1.5;
                    if (p.x > W + 20) { p.x = -20; p.y = Math.random() * H * 0.5; }
                    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 25, p.y - 12);
                    ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = 0.7; ctx.lineWidth = 1.5; ctx.stroke();
                    ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
                    ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.globalAlpha = 1;
                });
                break;

            case 'constellation':
                if (!particles.length) initP(25);
                particles.forEach(p => {
                    ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
                    ctx.fillStyle = pc; ctx.fill();
                });
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i+1; j < particles.length; j++) {
                        const d = Math.hypot(particles[i].x-particles[j].x, particles[i].y-particles[j].y);
                        if (d < 70) {
                            ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = pc; ctx.globalAlpha = (1-d/70)*0.5;
                            ctx.lineWidth = 0.5; ctx.stroke(); ctx.globalAlpha = 1;
                        }
                    }
                }
                break;

            case 'cosmicDust':
                if (!particles.length) initP(50);
                particles.forEach(p => {
                    p.x += Math.sin(tick*0.01+p.life)*0.3; p.y += Math.cos(tick*0.008+p.life)*0.3;
                    const g = (Math.sin(tick*0.02+p.life*2)+1)/2;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*(1+g), 0, Math.PI*2);
                    ctx.fillStyle = pc; ctx.globalAlpha = g*0.5; ctx.fill(); ctx.globalAlpha = 1;
                });
                break;

            case 'auroraStars':
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath(); ctx.moveTo(0, H*0.3+i*20);
                    for (let x = 0; x < W; x += 4) {
                        ctx.lineTo(x, H*0.3+i*20+Math.sin(x*0.02+tick*0.02+i)*30);
                    }
                    ctx.lineTo(W, H); ctx.lineTo(0, H);
                    ctx.fillStyle = pc; ctx.fill();
                }
                if (!particles.length) initP(35);
                particles.forEach(p => {
                    const tw = (Math.sin(tick*0.03+p.life)+1)/2;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*tw*0.8, 0, Math.PI*2);
                    ctx.fillStyle = '#ffffff'; ctx.globalAlpha = tw*0.5; ctx.fill(); ctx.globalAlpha = 1;
                });
                break;

            case 'sunRays':
                for (let i = 0; i < 12; i++) {
                    const a = (i/12)*Math.PI+tick*0.005;
                    ctx.beginPath(); ctx.moveTo(W/2, -20);
                    ctx.lineTo(W/2+Math.cos(a)*400, -20+Math.sin(a)*400);
                    ctx.lineTo(W/2+Math.cos(a+0.15)*400, -20+Math.sin(a+0.15)*400);
                    ctx.fillStyle = pc; ctx.globalAlpha = 0.08; ctx.fill(); ctx.globalAlpha = 1;
                }

            case 'leaves':

                    p.y += p.speed*0.4; p.x += Math.sin(tick*0.02+p.life)*0.8; p.angle += 0.03;

                    ctx.fillStyle = lc[Math.floor(p.life)%lc.length]; ctx.globalAlpha = 0.7;

                            const a = (i/4)*Math.PI*2+tick*0.02;

            case 'glitchLines':

            case 'rain':
                if (!particles.length) initP(55);

                    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x-0.5, p.y-10);
                    ctx.strokeStyle = pc; ctx.globalAlpha = 0.35; ctx.lineWidth = 1; ctx.stroke(); ctx.globalAlpha = 1;

            case 'matrixRain':

            case 'synthGrid':

                for (let i = -6; i <= 6; i++) { ctx.beginPath(); ctx.moveTo(W/2,hz); ctx.lineTo(W/2+i*70,H); ctx.stroke(); }
                ctx.globalAlpha = 1;

            case 'glitch':
                if (tick % 8 < 2) {

            case 'circuit':
                ctx.strokeStyle = pc; ctx.lineWidth = 0.8; ctx.globalAlpha = 0.4;

                        let cx=sx, cy=sy;
                        for (let j=0; j<4; j++) {
                            const dir=Math.floor(Math.random()*4), len=15+Math.random()*25;

                    }

                particles.forEach(p => {
                    p.segs.forEach(s => { ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke(); });

            case 'fire':

                    const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*6);
                    grad.addColorStop(0, pc); grad.addColorStop(1, 'transparent');

            case 'lava':
                for (let i = 0; i < 5; i++) {

            case 'portal':

                }

            case 'neonFlicker':

                });

            // ===== NEW EFFECTS =====
            case 'hexGrid':

            case 'ripple':

            case 'orbit':
                for (let i = 0; i < 5; i++) {

                    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(ex,ey); ctx.stroke();
                    const sway = Math.sin(tick*0.02+depth)*0.1;
                    drawBranch(ex, ey, len*0.67, angle-0.5+sway, depth-1);
                    drawBranch(ex, ey, len*0.67, angle+0.5+sway, depth-1);
                }
                drawBranch(W/2, H, 40, -Math.PI/2, 7);
                ctx.globalAlpha = 1;
                break;

            case 'kaleidoscope':
                const segments = 8;
                for (let i = 0; i < segments; i++) {
                    const a = (i/segments)*Math.PI*2+tick*0.01;
                    const r = 40+Math.sin(tick*0.03+i)*20;
                    const x = W/2+Math.cos(a)*r, y = H/2+Math.sin(a)*r;
                    const grad = ctx.createRadialGradient(x,y,0,x,y,25);
                    const hue = (tick*2+i*45)%360;
                    grad.addColorStop(0, `hsla(${hue},100%,50%,0.15)`);
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
                }
                break;

            case 'swirl':
                for (let i = 0; i < 60; i++) {
                    const a = i*0.3+tick*0.02;
                    const r = i*1.5;
                    const x = W/2+Math.cos(a)*r, y = H/2+Math.sin(a)*r;
                    ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2);
                    ctx.fillStyle = pc; ctx.globalAlpha = (1-i/60)*0.5; ctx.fill(); ctx.globalAlpha = 1;
                }
                break;

            case 'checkerboard':
                const cs = 20;
                ctx.fillStyle = pc;
                for (let x = 0; x < W; x += cs*2) for (let y = 0; y < H; y += cs*2) {
                    ctx.globalAlpha = 0.04;
                    ctx.fillRect(x, y, cs, cs);
                    ctx.fillRect(x+cs, y+cs, cs, cs);
                }
                ctx.globalAlpha = 1;
                break;

            case 'crosshatch':
                ctx.strokeStyle = pc; ctx.lineWidth = 0.3; ctx.globalAlpha = 0.15;
                for (let i = -H; i < W+H; i += 12) {
                    ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+H,H); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(i,H); ctx.lineTo(i+H,0); ctx.stroke();
                }
                ctx.globalAlpha = 1;
                break;

            case 'dotMatrix':
                ctx.fillStyle = pc;
                for (let x = 5; x < W; x += 10) for (let y = 5; y < H; y += 10) {
                    ctx.globalAlpha = 0.15;
                    ctx.beginPath(); ctx.arc(x, y, 1.2, 0, Math.PI*2); ctx.fill();
                }
                ctx.globalAlpha = 1;
                break;

            case 'spirograph':
                ctx.strokeStyle = pc; ctx.lineWidth = 0.8; ctx.globalAlpha = 0.3;
                ctx.beginPath();
                for (let t2 = 0; t2 < Math.PI*6; t2 += 0.05) {
                    const R = 50, r2 = 20, d = 30;
                    const x = W/2+(R-r2)*Math.cos(t2+tick*0.01)+d*Math.cos((R-r2)/r2*t2+tick*0.01);
                    const y = H/2+(R-r2)*Math.sin(t2+tick*0.01)-d*Math.sin((R-r2)/r2*t2+tick*0.01);
                    t2 === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
                }
                ctx.stroke(); ctx.globalAlpha = 1;
                break;

            case 'pendulum':
                for (let i = 0; i < 8; i++) {
                    const a = Math.sin(tick*0.03+i*0.3)*Math.PI*0.3;
                    const len = 60+i*10;
                    const x = W/2+Math.sin(a)*len, y = 10+Math.cos(a)*len;
                    ctx.beginPath(); ctx.moveTo(W/2, 10); ctx.lineTo(x, y);
                    ctx.strokeStyle = pc; ctx.globalAlpha = 0.2; ctx.lineWidth = 1; ctx.stroke();
                    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2);
                    ctx.fillStyle = pc; ctx.globalAlpha = 0.4; ctx.fill(); ctx.globalAlpha = 1;
                }
                break;

            case 'interference':
                for (let x = 0; x < W; x += 3) {
                    for (let y = 0; y < H; y += 3) {
                        const d1 = Math.hypot(x-W*0.3, y-H*0.5);
                        const d2 = Math.hypot(x-W*0.7, y-H*0.5);
                        const v = Math.sin(d1*0.05-tick*0.03)+Math.sin(d2*0.05-tick*0.03);
                        if (v > 1.5) {
                            ctx.fillStyle = pc; ctx.globalAlpha = 0.15;
                            ctx.fillRect(x, y, 3, 3); ctx.globalAlpha = 1;
                        }
                    }
                }
                break;

            case 'dna':
                for (let i = 0; i < 30; i++) {
                    const y = i*(H/30);
                    const x1 = W/2+Math.sin(i*0.4+tick*0.03)*40;
                    const x2 = W/2-Math.sin(i*0.4+tick*0.03)*40;
                    ctx.beginPath(); ctx.arc(x1, y, 3, 0, Math.PI*2);
                    ctx.fillStyle = pc; ctx.globalAlpha = 0.5; ctx.fill();
                    ctx.beginPath(); ctx.arc(x2, y, 3, 0, Math.PI*2);
                    ctx.fill();
                    if (i%3===0) {
                        ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y);
                        ctx.strokeStyle = pc; ctx.globalAlpha = 0.2; ctx.lineWidth = 1; ctx.stroke();
                    }
                    ctx.globalAlpha = 1;
                }
                break;

            case 'voronoi':
                if (!particles.length) initP(15);
                particles.forEach(p => {
                    p.x += Math.sin(tick*0.01+p.life)*0.3;
                    p.y += Math.cos(tick*0.008+p.life)*0.3;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                    ctx.fillStyle = pc; ctx.globalAlpha = 0.4; ctx.fill(); ctx.globalAlpha = 1;
                });
                break;

            case 'perlinFlow':
                if (!particles.length) initP(60);
                particles.forEach(p => {
                    const angle = Math.sin(p.x*0.01)*Math.PI+Math.cos(p.y*0.01)*Math.PI+tick*0.01;
                    p.x += Math.cos(angle)*0.8; p.y += Math.sin(angle)*0.8;
                    if (p.x<0||p.x>W||p.y<0||p.y>H) { p.x=Math.random()*W; p.y=Math.random()*H; }
                    ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, Math.PI*2);
                    ctx.fillStyle = pc; ctx.globalAlpha = 0.4; ctx.fill(); ctx.globalAlpha = 1;
                });
                break;

            case 'magneticField':
                ctx.strokeStyle = pc; ctx.lineWidth = 0.5; ctx.globalAlpha = 0.2;
                for (let i = 0; i < 20; i++) {
                    ctx.beginPath();
                    let fx = (i/20)*W, fy = H/2;
                    ctx.moveTo(fx, fy);
                    for (let j = 0; j < 30; j++) {
                        const dx1 = fx-W*0.3, dy1 = fy-H/2;
                        const dx2 = fx-W*0.7, dy2 = fy-H/2;
                        const d1 = Math.hypot(dx1,dy1)+1, d2 = Math.hypot(dx2,dy2)+1;
                        const ax = dx1/d1/d1*500-dx2/d2/d2*500;
                        const ay = dy1/d1/d1*500-dy2/d2/d2*500;
                        fx += ax*5; fy += ay*5;
                        ctx.lineTo(fx, fy);
                    }
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
                break;

            case 'electricArc':
                for (let i = 0; i < 3; i++) {
                    let ax = W*0.2, ay = H/2;
                    ctx.beginPath(); ctx.moveTo(ax, ay);
                    for (let j = 0; j < 15; j++) {
                        ax += (W*0.6)/15; ay = H/2+(Math.random()-0.5)*60;
                        ctx.lineTo(ax, ay);
                    }
                    ctx.strokeStyle = pc; ctx.globalAlpha = 0.3+Math.random()*0.3;
                    ctx.lineWidth = 1+Math.random(); ctx.stroke(); ctx.globalAlpha = 1;
                }
                break;

            case 'quantumField':
                if (!particles.length) initP(40);
                particles.forEach(p => {
                    p.x += Math.sin(p.y*0.02+tick*0.02)*1;
                    p.y += Math.cos(p.x*0.02+tick*0.015)*1;
                    if (p.x<0) p.x=W; if(p.x>W) p.x=0; if(p.y<0) p.y=H; if(p.y>H) p.y=0;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2);
                    ctx.fillStyle = pc; ctx.globalAlpha = 0.4; ctx.fill(); ctx.globalAlpha = 1;
                });
                break;

            case 'laserBeam':
                for (let i = 0; i < 4; i++) {
                    const y = H*0.2+i*H*0.2+Math.sin(tick*0.02+i)*15;
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y+Math.sin(tick*0.03+i*2)*10);
                    ctx.strokeStyle = pc; ctx.globalAlpha = 0.3; ctx.lineWidth = 2; ctx.stroke();
                    // Glow
                    const lg = ctx.createLinearGradient(0,y-5,0,y+5);
                    lg.addColorStop(0,'transparent'); lg.addColorStop(0.5,pc); lg.addColorStop(1,'transparent');
                    ctx.fillStyle = lg; ctx.globalAlpha = 0.1; ctx.fillRect(0,y-5,W,10);
                    ctx.globalAlpha = 1;
                }
                break;

            case 'radarSweep':
                const ra = tick*0.03;
                ctx.beginPath(); ctx.moveTo(W/2, H/2);
                ctx.arc(W/2, H/2, Math.min(W,H)*0.4, ra, ra+0.3);
                ctx.closePath();
                const rg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.min(W,H)*0.4);
                rg.addColorStop(0, pc); rg.addColorStop(1, 'transparent');
                ctx.fillStyle = rg; ctx.globalAlpha = 0.2; ctx.fill();
                // Rings
                for (let i = 1; i <= 3; i++) {
                    ctx.beginPath(); ctx.arc(W/2, H/2, i*Math.min(W,H)*0.13, 0, Math.PI*2);
                    ctx.strokeStyle = pc; ctx.globalAlpha = 0.1; ctx.lineWidth = 0.5; ctx.stroke();
                }
                ctx.globalAlpha = 1;
                break;

            case 'oscilloscope':
                ctx.strokeStyle = pc; ctx.lineWidth = 2; ctx.globalAlpha = 0.5;
                ctx.beginPath();
                for (let x = 0; x < W; x++) {
                    const y = H/2+Math.sin(x*0.05+tick*0.08)*30*Math.sin(x*0.01+tick*0.02);
                    x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
                }
                ctx.stroke(); ctx.globalAlpha = 1;
                break;

            case 'frequencyBars':
                for (let i = 0; i < 40; i++) {
                    const h = Math.abs(Math.sin(tick*0.04+i*0.4))*80+5;
                    const x = (i/40)*W;
                    ctx.fillStyle = pc; ctx.globalAlpha = 0.3;
                    ctx.fillRect(x, H-h, W/42, h);
                }
                ctx.globalAlpha = 1;
                break;

            case 'vinyl':
                for (let i = 0; i < 15; i++) {
                    const r = 15+i*6;
                    ctx.beginPath(); ctx.arc(W/2, H/2, r, 0, Math.PI*2);
                    ctx.strokeStyle = pc; ctx.globalAlpha = 0.08; ctx.lineWidth = 2; ctx.stroke();
                }
                // Spinning highlight
                const va = tick*0.02;
                ctx.beginPath(); ctx.moveTo(W/2, H/2);
                ctx.lineTo(W/2+Math.cos(va)*90, H/2+Math.sin(va)*90);
                ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = 0.15; ctx.lineWidth = 1; ctx.stroke();
                ctx.globalAlpha = 1;
                break;

            case 'filmGrain':
                for (let i = 0; i < 200; i++) {
                    const x = Math.random()*W, y = Math.random()*H;
                    ctx.fillStyle = Math.random()>0.5?'#ffffff':'#000000';
                    ctx.globalAlpha = Math.random()*0.08;
                    ctx.fillRect(x, y, 1, 1);
                }
                ctx.globalAlpha = 1;
                break;

            case 'bokeh':
                if (!particles.length) initP(12);
                particles.forEach(p => {
                    p.x += Math.sin(tick*0.005+p.life)*0.2; p.y += Math.cos(tick*0.004+p.life)*0.2;
                    const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*8);
                    grad.addColorStop(0, pc); grad.addColorStop(0.5, pc);
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad; ctx.globalAlpha = 0.08; ctx.fill;
                    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*8,0,Math.PI*2);
                    ctx.fillStyle = grad; ctx.fill();
                    ctx.globalAlpha = 1;
                });
                break;

            case 'godRays':
                for (let i = 0; i < 8; i++) {
                    const a = (i/8)*Math.PI*2+tick*0.003;
                    ctx.beginPath(); ctx.moveTo(W/2, 0);
                    ctx.lineTo(W/2+Math.cos(a)*W, Math.sin(a)*W);
                    ctx.lineTo(W/2+Math.cos(a+0.2)*W, Math.sin(a+0.2)*W);
                    ctx.closePath();
                    ctx.fillStyle = pc; ctx.globalAlpha = 0.03; ctx.fill(); ctx.globalAlpha = 1;
                }
                break;

            case 'volumetricLight':
                const vlg = ctx.createRadialGradient(W/2,0,0,W/2,0,H);
                vlg.addColorStop(0, pc); vlg.addColorStop(1, 'transparent');
                ctx.fillStyle = vlg; ctx.globalAlpha = 0.1; ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1;
                break;

            case 'caustics':
                for (let x = 0; x < W; x += 5) for (let y = 0; y < H; y += 5) {
                    const v = Math.sin(x*0.04+tick*0.02)*Math.sin(y*0.04+tick*0.015);
                    if (v > 0.7) {
                        ctx.fillStyle = pc; ctx.globalAlpha = v*0.2;
                        ctx.fillRect(x, y, 5, 5); ctx.globalAlpha = 1;
                    }
                }
                break;

            case 'refraction':
                for (let i = 0; i < 5; i++) {
                    const cx = W/2+Math.sin(tick*0.015+i*1.5)*60;
                    const cy = H/2+Math.cos(tick*0.012+i*2)*30;
                    ctx.beginPath(); ctx.arc(cx, cy, 20+i*8, 0, Math.PI*2);
                    const hue = (tick*2+i*60)%360;
                    ctx.fillStyle = `hsla(${hue},80%,60%,0.06)`;
                    ctx.fill();
                }
                break;

            case 'crystalGrowth':
                ctx.strokeStyle = pc; ctx.lineWidth = 1; ctx.globalAlpha = 0.25;
                for (let i = 0; i < 6; i++) {
                    const a = (i/6)*Math.PI*2+tick*0.005;
                    const len = 30+Math.sin(tick*0.02+i)*15;
                    ctx.beginPath(); ctx.moveTo(W/2, H/2);
                    ctx.lineTo(W/2+Math.cos(a)*len, H/2+Math.sin(a)*len);
                    ctx.stroke();
                    // Branches
                    const ex = W/2+Math.cos(a)*len, ey = H/2+Math.sin(a)*len;
                    for (let j = -1; j <= 1; j += 2) {
                        ctx.beginPath(); ctx.moveTo(ex, ey);
                        ctx.lineTo(ex+Math.cos(a+j*0.6)*len*0.5, ey+Math.sin(a+j*0.6)*len*0.5);
                        ctx.stroke();
                    }
                }
                ctx.globalAlpha = 1;
                break;

            case 'snowflakePattern':
                ctx.strokeStyle = pc; ctx.lineWidth = 0.8; ctx.globalAlpha = 0.2;
                for (let i = 0; i < 6; i++) {
                    const a = (i/6)*Math.PI*2;
                    ctx.beginPath(); ctx.moveTo(W/2, H/2);
                    const ex = W/2+Math.cos(a)*60, ey = H/2+Math.sin(a)*60;
                    ctx.lineTo(ex, ey); ctx.stroke();
                    for (let j = 0.3; j < 1; j += 0.3) {
                        const mx = W/2+Math.cos(a)*60*j, my = H/2+Math.sin(a)*60*j;
                        for (let k = -1; k <= 1; k += 2) {
                            ctx.beginPath(); ctx.moveTo(mx, my);
                            ctx.lineTo(mx+Math.cos(a+k*0.8)*15, my+Math.sin(a+k*0.8)*15);
                            ctx.stroke();
                        }
                    }
                }
                ctx.globalAlpha = 1;
                break;

            case 'mandala':
                ctx.strokeStyle = pc; ctx.lineWidth = 0.6; ctx.globalAlpha = 0.2;
                for (let ring = 1; ring <= 4; ring++) {
                    const r = ring*20;
                    const pts = ring*6;
                    for (let i = 0; i < pts; i++) {
                        const a = (i/pts)*Math.PI*2+tick*0.005*ring;
                        const x = W/2+Math.cos(a)*r, y = H/2+Math.sin(a)*r;
                        ctx.beginPath();
                        ctx.arc(x, y, 5+ring*2, 0, Math.PI*2);
                        ctx.stroke();
                    }
                }
                ctx.globalAlpha = 1;
                break;

            case 'sacredGeometry':
                ctx.strokeStyle = pc; ctx.lineWidth = 0.5; ctx.globalAlpha = 0.15;
                // Flower of life
                for (let i = 0; i < 7; i++) {
                    const a = (i/6)*Math.PI*2;
                    const x = i===0?W/2:W/2+Math.cos(a)*25;
                    const y = i===0?H/2:H/2+Math.sin(a)*25;
                    ctx.beginPath(); ctx.arc(x, y, 25, 0, Math.PI*2); ctx.stroke();
                }
                ctx.globalAlpha = 1;
                break;

            case 'runicGlow':
                if (!particles.length) initP(8);
                particles.forEach(p => {
                    const g = (Math.sin(tick*0.03+p.life)+1)/2;
                    ctx.font = '16px serif';
                    const runes = '᛫ᚠᚡᚢᚣᚤᚥᚦᚧ';
                    ctx.fillStyle = pc; ctx.globalAlpha = g*0.4;
                    ctx.fillText(runes[Math.floor(p.life)%runes.length], p.x, p.y);
                    ctx.globalAlpha = 1;
                });
                break;

            // Remaining effects get a default cool animation
            default:
                // Universal fallback: morphing particles
                if (!particles.length) initP(30);
                particles.forEach(p => {
                    p.x += Math.sin(tick*0.02+p.life)*0.5;
                    p.y += Math.cos(tick*0.015+p.phase)*0.5;
                    if (p.x<0) p.x=W; if(p.x>W) p.x=0;
                    if (p.y<0) p.y=H; if(p.y>H) p.y=0;
                    const g = (Math.sin(tick*0.03+p.life)+1)/2;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*(1+g), 0, Math.PI*2);
                    ctx.fillStyle = pc; ctx.globalAlpha = g*0.4; ctx.fill(); ctx.globalAlpha = 1;
                });
                break;
        }

        animFrames[id] = requestAnimationFrame(draw);
    }

    draw();
}

// ===== FULLSCREEN =====
function openFS(idx) {
    currentFSIndex = idx;
    renderFS();
    document.getElementById('fsOverlay').classList.add('active');
}

function closeFS() {
    document.getElementById('fsOverlay').classList.remove('active');
    if (animFrames['fs']) { cancelAnimationFrame(animFrames['fs']); delete animFrames['fs']; }
    if (isRecording) stopRecording();
}

function navFS(dir) {
    currentFSIndex = (currentFSIndex + dir + filteredThemes.length) % filteredThemes.length;
    if (animFrames['fs']) { cancelAnimationFrame(animFrames['fs']); delete animFrames['fs']; }
    renderFS();
}

function renderFS() {
    const theme = filteredThemes[currentFSIndex];
    const overlay = document.getElementById('fsOverlay');
    const canvas = document.getElementById('fsCanvas');

    overlay.style.background = theme.bg;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    updateFSName();
    document.getElementById('fsLabel').textContent = `${theme.name} • ${theme.cat} • ${currentFSIndex+1}/${filteredThemes.length}`;

    if (animFrames['fs']) cancelAnimationFrame(animFrames['fs']);
    startEffect(canvas, theme, 'fs');
}

function updateFSName() {
    const theme = filteredThemes[currentFSIndex];
    const wrap = document.getElementById('fsNameWrap');
    const len = currentName.length;
    const fontSize = len > 25 ? '3vw' : len > 18 ? '5vw' : len > 10 ? '7vw' : '9vw';

    wrap.style.fontFamily = `"${theme.font}", sans-serif`;
    wrap.style.color = theme.color;
    wrap.style.fontSize = fontSize;
    wrap.style.fontWeight = '700';
    wrap.style.letterSpacing = '0.05em';
    if (theme.glow && theme.glow !== 'transparent') {
        wrap.style.textShadow = `0 0 20px ${theme.glow}, 0 0 40px ${theme.glow}, 0 0 80px ${theme.glow}, 0 0 160px ${theme.glow}`;
    } else {
        wrap.style.textShadow = 'none';
    }
    wrap.textContent = currentName;
}

// ===== DOWNLOAD PNG =====
function downloadPNG() { exportPNG(1920, 1080); }
function downloadPNG4K() { exportPNG(3840, 2160); }

function exportPNG(w, h) {
    const theme = filteredThemes[currentFSIndex];
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');

    // Background
    if (theme.bg.startsWith('linear')) {
        const grad = ctx.createLinearGradient(0, 0, w, h);
        const colors = theme.bg.match(/#[a-fA-F0-9]{3,8}/g);
        if (colors) colors.forEach((col, i) => grad.addColorStop(i/(colors.length-1), col));
        ctx.fillStyle = grad;
    } else {
        ctx.fillStyle = theme.bg;
    }
    ctx.fillRect(0, 0, w, h);

    // Name
    const fontSize = currentName.length > 20 ? w*0.04 : currentName.length > 10 ? w*0.06 : w*0.08;
    ctx.font = `700 ${fontSize}px "${theme.font}", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (theme.glow && theme.glow !== 'transparent') {
        ctx.shadowColor = theme.glow; ctx.shadowBlur = 60;
    }
    ctx.fillStyle = theme.color;
    for (let i = 0; i < 4; i++) ctx.fillText(currentName, w/2, h/2);

    const link = document.createElement('a');
    link.download = `${currentName}_${theme.name.replace(/\s/g,'_')}_${w}x${h}.png`;
    link.href = c.toDataURL('image/png');
    link.click();
    showToast(`📥 PNG ${w}x${h} downloaded!`);
}

// ===== VIDEO RECORDING =====
function startVideoRecord() {
    const canvas = document.getElementById('fsCanvas');
    const stream = canvas.captureStream(30);
    recordedChunks = [];

    try {
        mediaRecorder = new MediaRecorder(stream, {
            mimeType: 'video/webm;codecs=vp9',
            videoBitsPerSecond: 5000000
        });
    } catch(e) {
        try {
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        } catch(e2) {
            showToast('❌ Video recording not supported in this browser');
            return;
        }
    }

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };

    mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${currentName}_${filteredThemes[currentFSIndex].name.replace(/\s/g,'_')}.webm`;
        a.click();
        URL.revokeObjectURL(url);
        isRecording = false;
        document.getElementById('recIndicator').classList.remove('active');
        showToast('🎬 Video saved!');
    };

    mediaRecorder.start();
    isRecording = true;
    document.getElementById('recIndicator').classList.add('active');
    showToast('🎬 Recording... Click GIF/Video again or wait 8s');

    // Auto-stop after 8 seconds
    setTimeout(() => {
        if (isRecording) stopRecording();
    }, 8000);
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
    }
}

// ===== GIF RECORDING =====
function startGIFRecord() {
    const canvas = document.getElementById('fsCanvas');
    const theme = filteredThemes[currentFSIndex];

    showProgress('Generating GIF...', 0);

    // Capture frames
    const frames = [];
    const totalFrames = 60; // 2 seconds at 30fps
    const w = 640, h = 360;

    // Create offscreen canvas
    const oc = document.createElement('canvas');
    oc.width = w; oc.height = h;
    const octx = oc.getContext('2d');

    let frame = 0;

    function captureFrame() {
        if (frame >= totalFrames) {
            // Encode as animated GIF using simple approach
            encodeGIF(frames, w, h);
            return;
        }

        // Draw current canvas state scaled down
        octx.drawImage(canvas, 0, 0, w, h);

        // Draw name on top
        const fontSize = currentName.length > 15 ? 28 : currentName.length > 10 ? 36 : 48;
        octx.font = `700 ${fontSize}px "${theme.font}", sans-serif`;
        octx.textAlign = 'center'; octx.textBaseline = 'middle';
        if (theme.glow && theme.glow !== 'transparent') {
            octx.shadowColor = theme.glow; octx.shadowBlur = 20;
        }
        octx.fillStyle = theme.color;
        octx.fillText(currentName, w/2, h/2);
        octx.shadowBlur = 0;

        frames.push(oc.toDataURL('image/png'));

        frame++;
        updateProgress(frame / totalFrames * 50);
        requestAnimationFrame(captureFrame);
    }

    captureFrame();
}

async function encodeGIF(framePNGs, w, h) {
    // Since we can't use external GIF libraries on GH Pages easily,
    // we'll create an animated WebP/APNG fallback, or download frames as ZIP
    // BUT - let's do a proper GIF using a minimal inline encoder!

    updateProgress(60);
    showProgress('Creating GIF file...', 60);

    // Use a canvas-based approach to create downloadable GIF
    // We'll create individual frame images and use a simple GIF encoder

    try {
        // Method: Create animated GIF using minimal encoder
        const gif = new SimpleGIF(w, h);

        for (let i = 0; i < framePNGs.length; i++) {
            const img = new Image();
            img.src = framePNGs[i];
            await new Promise(r => { img.onload = r; });

            const tc = document.createElement('canvas');
            tc.width = w; tc.height = h;
            const tctx = tc.getContext('2d');
            tctx.drawImage(img, 0, 0);
            const imageData = tctx.getImageData(0, 0, w, h);

            gif.addFrame(imageData.data, 33); // 33ms delay = ~30fps
            updateProgress(60 + (i / framePNGs.length) * 35);
        }

        const blob = gif.encode();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${currentName}_${filteredThemes[currentFSIndex].name.replace(/\s/g,'_')}.gif`;
        a.click();
        URL.revokeObjectURL(url);

        hideProgress();
        showToast('🎞️ GIF saved!');
    } catch(e) {
        console.error('GIF Error:', e);
        // Fallback: download as video
        hideProgress();
        showToast('⚠️ GIF failed, trying video...');
        startVideoRecord();
    }
}

// ===== MINIMAL GIF ENCODER =====
class SimpleGIF {
    constructor(width, height) {
        this.width = width;
        this.height = height;
        this.frames = [];
    }

    addFrame(rgbaData, delay) {
        // Quantize to 256 colors
        const { indexedPixels, colorTable } = this.quantize(rgbaData);
        this.frames.push({ indexedPixels, colorTable, delay });
    }

    quantize(rgba) {
        // Simple median-cut-like quantization to 256 colors
        const colorMap = new Map();
        const pixels = rgba.length / 4;

        // Sample colors
        for (let i = 0; i < pixels; i++) {
            const idx = i * 4;
            // Reduce to 5-bit per channel for grouping
            const r = rgba[idx] >> 3 << 3;
            const g = rgba[idx+1] >> 3 << 3;
            const b = rgba[idx+2] >> 3 << 3;
            const key = (r << 16) | (g << 8) | b;
            colorMap.set(key, (colorMap.get(key) || 0) + 1);
        }

        // Get top 256 colors
        const sorted = [...colorMap.entries()].sort((a, b) => b[1] - a[1]).slice(0, 255);
        const colorTable = sorted.map(([key]) => [
            (key >> 16) & 0xFF,
            (key >> 8) & 0xFF,
            key & 0xFF
        ]);

        // Pad to 256
        while (colorTable.length < 256) colorTable.push([0, 0, 0]);

        // Map pixels to indices
        const indexedPixels = new Uint8Array(pixels);
        for (let i = 0; i < pixels; i++) {
            const idx = i * 4;
            const r = rgba[idx], g = rgba[idx+1], b = rgba[idx+2];
            let bestIdx = 0, bestDist = Infinity;
            for (let j = 0; j < Math.min(colorTable.length, 256); j++) {
                const dr = r - colorTable[j][0];
                const dg = g - colorTable[j][1];
                const db = b - colorTable[j][2];
                const dist = dr*dr + dg*dg + db*db;
                if (dist < bestDist) { bestDist = dist; bestIdx = j; }
                if (dist === 0) break;
            }
            indexedPixels[i] = bestIdx;
        }

        return { indexedPixels, colorTable };
    }

    encode() {
        const bytes = [];
        const w = (b) => bytes.push(b & 0xFF);
        const w16 = (v) => { w(v & 0xFF); w((v >> 8) & 0xFF); };

        // Header
        [0x47,0x49,0x46,0x38,0x39,0x61].forEach(w); // GIF89a

        // Logical Screen Descriptor
        w16(this.width);
        w16(this.height);
        w(0xF7); // GCT flag, 8-bit color, 256 colors
        w(0); // BG color
        w(0); // Pixel aspect ratio

        // Global Color Table (from first frame)
        if (this.frames.length > 0) {
            this.frames[0].colorTable.forEach(c => { w(c[0]); w(c[1]); w(c[2]); });
        }

        // Netscape extension for looping
        w(0x21); w(0xFF); w(0x0B);
        [0x4E,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2E,0x30].forEach(w);
        w(0x03); w(0x01); w16(0); w(0x00);

        // Frames
        this.frames.forEach(frame => {
            // Graphics Control Extension
            w(0x21); w(0xF9); w(0x04);
            w(0x00); // Disposal
            w16(Math.round(frame.delay / 10)); // Delay in centiseconds
            w(0x00); // Transparent color
            w(0x00);

            // Image Descriptor
            w(0x2C);
            w16(0); w16(0); // Position
            w16(this.width); w16(this.height);
            w(0x00); // No local color table

            // LZW Minimum Code Size
            const minCodeSize = 8;
            w(minCodeSize);

            // LZW Compress
            const compressed = this.lzwEncode(frame.indexedPixels, minCodeSize);

            // Write sub-blocks
            let offset = 0;
            while (offset < compressed.length) {
                const blockSize = Math.min(255, compressed.length - offset);
                w(blockSize);
                for (let i = 0; i < blockSize; i++) w(compressed[offset + i]);
                offset += blockSize;
            }
            w(0x00); // Block terminator
        });

        // Trailer
        w(0x3B);

        return new Blob([new Uint8Array(bytes)], { type: 'image/gif' });
    }

    lzwEncode(pixels, minCodeSize) {
        const clearCode = 1 << minCodeSize;
        const eoiCode = clearCode + 1;
        let codeSize = minCodeSize + 1;
        let nextCode = eoiCode + 1;

        // Build initial table
        let table = new Map();
        for (let i = 0; i < clearCode; i++) table.set(String(i), i);

        const output = [];
        let bitBuffer = 0;
        let bitCount = 0;

        const emit = (code) => {
            bitBuffer |= code << bitCount;
            bitCount += codeSize;
            while (bitCount >= 8) {
                output.push(bitBuffer & 0xFF);
                bitBuffer >>= 8;
                bitCount -= 8;
            }
        };

        emit(clearCode);

        let current = String(pixels[0]);

        for (let i = 1; i < pixels.length; i++) {
            const next = current + ',' + pixels[i];
            if (table.has(next)) {
                current = next;
            } else {
                emit(table.get(current));
                if (nextCode < 4096) {
                    table.set(next, nextCode++);
                    if (nextCode > (1 << codeSize) && codeSize < 12) codeSize++;
                } else {
                    emit(clearCode);
                    table = new Map();
                    for (let j = 0; j < clearCode; j++) table.set(String(j), j);
                    nextCode = eoiCode + 1;
                    codeSize = minCodeSize + 1;
                }
                current = String(pixels[i]);
            }
        }

        emit(table.get(current));
        emit(eoiCode);

        if (bitCount > 0) output.push(bitBuffer & 0xFF);

        return output;
    }
}

// ===== PROGRESS =====
function showProgress(title, pct) {
    const el = document.getElementById('progressOverlay');
    el.classList.add('active');
    document.getElementById('progressTitle').textContent = title;
    updateProgress(pct);
}

function updateProgress(pct) {
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressText').textContent = Math.round(pct) + '%';
}

function hideProgress() {
    document.getElementById('progressOverlay').classList.remove('active');
}

// ===== TOAST =====
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== RESIZE =====
window.addEventListener('resize', () => {
    if (document.getElementById('fsOverlay').classList.contains('active')) {
        document.getElementById('fsCanvas').width = window.innerWidth;
        document.getElementById('fsCanvas').height = window.innerHeight;
    }
});
